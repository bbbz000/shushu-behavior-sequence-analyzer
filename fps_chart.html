<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数数用户行为序列 · 属性波形图</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --border:#e4e7ec; --text:#1f2430;
    --muted:#6b7280; --accent:#3b6cf6; --danger:#e5484d; --ok:#2fa36b;
    --input-bg:#fbfcfd; --ghost-bg:#eef1f6; --range-bg:#fafbfc;
    /* 图表专用（canvas 读取） */
    --c-grid:#eceef1; --c-vgrid:#f0f2f5; --c-axis:#9aa1ac; --c-cat:#6b7280;
    --c-baseline:#d7dbe0; --c-reltext:#b7bcc4; --c-pointborder:#ffffff; --c-vlabel:#4b5563;
  }
  :root[data-theme="dark"]{
    --bg:#0f141b; --panel:#171d26; --border:#2a323e; --text:#e6ebf2;
    --muted:#95a0b0; --accent:#5b8bff; --danger:#f0666b; --ok:#3fc07f;
    --input-bg:#0f141b; --ghost-bg:#232b36; --range-bg:#1b222c;
    --c-grid:#232b36; --c-vgrid:#1e252f; --c-axis:#7c8797; --c-cat:#95a0b0;
    --c-baseline:#3a4453; --c-reltext:#5f6b7a; --c-pointborder:#171d26; --c-vlabel:#aab4c2;
  }
  html,body{transition:background .2s,color .2s;}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    padding:24px;
  }
  .top{display:flex;align-items:center;gap:12px;}
  h1{font-size:18px;margin:0 0 4px;flex:1;}
  #themeBtn{background:var(--ghost-bg);color:var(--text);border-radius:8px;padding:7px 14px;font-size:13px;}
  .sub{color:var(--muted);margin:0 0 18px;font-size:13px;}
  .wrap{max-width:1100px;margin:0 auto;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
  textarea{
    width:100%;min-height:180px;resize:vertical;border:1px solid var(--border);
    border-radius:8px;padding:12px;font:12px/1.55 "Consolas","Menlo",monospace;
    color:var(--text);background:var(--input-bg);outline:none;
  }
  textarea:focus{border-color:var(--accent);}
  .row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;}
  button{
    border:none;border-radius:8px;padding:9px 18px;font-size:14px;cursor:pointer;
    background:var(--accent);color:#fff;font-weight:500;
  }
  button:hover{filter:brightness(1.05);}
  button.ghost{background:var(--ghost-bg);color:var(--text);}
  button.mini{padding:5px 12px;font-size:12px;}
  select{
    border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;
    background:var(--panel);color:var(--text);cursor:pointer;outline:none;
  }
  select:focus{border-color:var(--accent);}
  .status{font-size:13px;}
  .status.err{color:var(--danger);}
  .status.ok{color:var(--ok);}
  .meta{color:var(--muted);font-size:12px;margin-left:auto;}
  canvas{width:100%;display:block;}
  details{margin-top:4px;}
  summary{cursor:pointer;color:var(--muted);font-size:13px;user-select:none;}
  pre{
    background:#0f1420;color:#d7e0ef;border-radius:8px;padding:14px;overflow:auto;
    font:12px/1.5 "Consolas","Menlo",monospace;max-height:360px;margin:10px 0 0;
  }
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:6px 0;flex-wrap:wrap;align-items:center;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
  #tooltip{
    position:fixed;pointer-events:none;background:#0f1420;color:#fff;padding:8px 10px;
    border-radius:6px;font-size:12px;opacity:0;transition:opacity .08s;
    z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:320px;
  }
  #tooltip .tp-title{font-weight:600;font-size:13px;margin-bottom:2px;}
  #tooltip .tp-sub{color:#9aa4b8;font-size:11px;margin-bottom:6px;}
  #tooltip .tp-props{display:flex;flex-direction:column;gap:2px;}
  #tooltip .tp-row{display:flex;gap:10px;line-height:1.35;}
  #tooltip .tp-k{color:#9aa4b8;flex:0 0 auto;min-width:52px;}
  #tooltip .tp-v{color:#e6ebf5;word-break:break-all;text-align:right;flex:1;}
  .ctl-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .ctl-title{font-weight:600;font-size:14px;}
  .filter-list{display:flex;flex-wrap:wrap;gap:8px 18px;}
  .filter-item{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none;}
  .filter-item input{width:15px;height:15px;cursor:pointer;accent-color:var(--accent);}
  .filter-item .cnt{color:var(--muted);font-size:11px;}
  .filter-item .nofps{color:#c0392b;font-size:11px;}
  .chart-ctl{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .chart-ctl label{font-size:13px;color:var(--muted);}
  .chart-ctl label.chk{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;}
  .chart-ctl label.chk input{width:15px;height:15px;cursor:pointer;accent-color:var(--accent);}
  .range-ctl{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px;padding:10px 14px;background:var(--range-bg);border:1px solid var(--border);border-radius:8px;}
  .range-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
  .range-row .tag{min-width:34px;}
  .range-row .val{font-family:Consolas,Menlo,monospace;color:var(--text);}
  .dual-slider{position:relative;height:30px;margin:2px 8px 0;touch-action:none;}
  .ds-track{position:absolute;top:13px;left:0;right:0;height:4px;background:var(--border);border-radius:2px;}
  .ds-fill{position:absolute;top:13px;height:4px;background:var(--accent);border-radius:2px;}
  .ds-thumb{position:absolute;top:7px;width:16px;height:16px;margin-left:-8px;background:var(--panel);
    border:2px solid var(--accent);border-radius:50%;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.25);outline:none;}
  .ds-thumb:hover{background:var(--ghost-bg);}
  .ds-thumb:focus-visible{box-shadow:0 0 0 3px rgba(59,108,246,.3);}
  .ds-thumb:active{cursor:grabbing;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>数数用户行为序列 · 属性波形图</h1>
    <button id="themeBtn" title="切换日间/夜间模式">🌙 夜间</button>
  </div>
  <p class="sub">粘贴「用户行为序列」原始文本后点击生成。横轴为时间轴，纵轴为你选择的属性：数值属性（fps、ping…）画数值波形，文本属性（state、stage…）画类别轨迹。可按事件名称筛选。</p>

  <div class="panel">
    <textarea id="input" placeholder="在这里粘贴数数导出的原始文本，例如：&#10;2026-09-03&#10;12:17:47.882&#10;ta_app_start&#10;事件名称&#10;ta_app_start&#10;12:17:51.023&#10;总服登录上报token&#10;token&#10;MwTe...&#10;account&#10;LDL3509546285738&#10;事件名称&#10;SDKLoginToken&#10;fps&#10;60"></textarea>
    <div class="row">
      <button id="run">生成波形图</button>
      <button id="demo" class="ghost">填入示例</button>
      <button id="clear" class="ghost">清空</button>
      <span id="status" class="status"></span>
      <span id="meta" class="meta"></span>
    </div>
  </div>

  <div class="panel" id="filterPanel" style="display:none;">
    <div class="ctl-head">
      <span class="ctl-title">事件筛选</span>
      <button id="checkAll" class="ghost mini">全选</button>
      <button id="checkNone" class="ghost mini">全不选</button>
    </div>
    <div class="filter-list" id="filterList"></div>
  </div>

  <div class="panel" id="chartPanel" style="display:none;">
    <div class="chart-ctl">
      <label for="metric">分析属性（纵轴）</label>
      <select id="metric"></select>
      <label class="chk"><input type="checkbox" id="showValues" checked>显示数值</label>
      <span id="metricInfo" class="meta" style="margin-left:0;"></span>
    </div>
    <div class="range-ctl" id="rangeCtl" style="display:none;">
      <div class="range-row">
        <span class="tag">时间区间</span>
        <span class="val" id="rangeStartVal">--</span>
        <span style="color:var(--muted);">→</span>
        <span class="val" id="rangeEndVal">--</span>
        <button id="rangeReset" class="ghost mini" style="margin-left:auto;">重置区间</button>
      </div>
      <div class="dual-slider" id="dualSlider">
        <div class="ds-track"></div>
        <div class="ds-fill" id="dsFill"></div>
        <div class="ds-thumb" id="dsThumbA" tabindex="0" role="slider" aria-label="开始时间"></div>
        <div class="ds-thumb" id="dsThumbB" tabindex="0" role="slider" aria-label="结束时间"></div>
      </div>
      <div class="range-row">
        <span id="rangeInfo" class="meta" style="margin-left:0;"></span>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <canvas id="chart"></canvas>
  </div>

  <div class="panel" id="jsonPanel" style="display:none;">
    <details open>
      <summary>转换结果 JSON <span id="copyBtn" style="color:var(--accent);margin-left:8px;">复制</span></summary>
      <pre id="json"></pre>
    </details>
  </div>
</div>
<div id="tooltip"></div>

<script>
const DEMO = `2026-09-03
12:17:47.882
ta_app_start
事件名称
ta_app_start
12:17:51.023
总服登录上报token

LDL3509546285738

12:18:02.489

12:18:02.590
创角日志

create_role_success
12:18:02.592
角色登陆日志
事件名称

12:18:11.981
引导

const timeRe = /^\d{1,2}:\d{2}:\d{2}\.\d{1,3}$/;
const dateRe = /^\d{4}-\d{2}-\d{2}$/;

function timeToMs(t){
  const m = t.match(/^(\d{1,2}):(\d{2}):(\d{2})\.(\d{1,3})$/);
  if(!m) return null;
  return ((+m[1])*3600 + (+m[2])*60 + (+m[3]))*1000 + Number(m[4].padEnd(3,'0'));
}

// 把原始文本解析成 {date, events:[{time,tMs,name,propty}]}
function parse(raw){
  const lines = raw.split(/\r?\n/).map(s=>s.trim()).filter(s=>s.length>0);
  if(lines.length===0) throw new Error("没有输入数据");

  let date = "";
  if(dateRe.test(lines[0])) date = lines[0];
  else { const d = lines.find(l=>dateRe.test(l)); if(d) date = d; }

  const content = lines.filter(l=>!dateRe.test(l));
  const events = [];
  let p = 0;

  while(p < content.length){
    if(!timeRe.test(content[p]))
      throw new Error(`解析失败：第 ${p+1} 行期望时间戳，却读到 “${content[p]}”`);
    const time = content[p++];

    if(p >= content.length)
      throw new Error(`解析失败：“${time}” 之后缺少事件标题`);
    const title = content[p++];

    const kvs = [];
    while(p < content.length && !timeRe.test(content[p])) kvs.push(content[p++]);
    if(kvs.length % 2 !== 0)
      throw new Error(`解析失败：事件 “${title}” (${time}) 的属性字段数为奇数，key/value 不成对`);

    const propty = {};
    for(let k=0;k<kvs.length;k+=2){
      const key = kvs[k];
      let val = kvs[k+1];
      if(/^-?\d+(\.\d+)?$/.test(val)) val = Number(val);
      propty[key] = val;
    }
    const name = propty["事件名称"] !== undefined ? String(propty["事件名称"]) : title;
    events.push({time, tMs:timeToMs(time), name, propty});
  }
  if(events.length===0) throw new Error("解析失败：未识别到任何事件");
  return {date, events};
}

// ---- 图表 ----
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
let hitboxes = [];

function fpsColor(v){ return v<30?'#e5484d': v<=50?'#e8a33d':'#2fa36b'; }

function fmtClock(ms){
  const s = Math.floor(ms/1000);
  const hh = String(Math.floor(s/3600)%24).padStart(2,'0');
  const mm = String(Math.floor(s/60)%60).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  return `${hh}:${mm}:${ss}`;
}
function fmtClockMs(ms){
  return fmtClock(ms) + '.' + String(ms%1000).padStart(3,'0');
}
// 相对第一个事件的时间，如 +1:30 / +50:59 / +1:05:09
function fmtRel(deltaMs){
  const sign = deltaMs<0 ? '-' : '+';
  let s = Math.round(Math.abs(deltaMs)/1000);
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60);   s -= m*60;
  const ss = String(s).padStart(2,'0');
  if(h>0) return `${sign}${h}:${String(m).padStart(2,'0')}:${ss}`;
  return `${sign}${m}:${ss}`;
}
function niceMax(v){
  if(v<=0) return 1;
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  const n=v/p;
  const step = n<=1?1:n<=2?2:n<=5?5:10;
  return step*p;
}
function fmtNum(v){
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}
// 读取当前主题下的 CSS 变量（供 canvas 使用）
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// events: 已按事件名筛选后的事件；metric: 属性名
function drawChart(events, metric){
  // 当前主题调色板（随日/夜模式变化）
  const C = {
    grid:cssVar('--c-grid'), vgrid:cssVar('--c-vgrid'), axis:cssVar('--c-axis'),
    cat:cssVar('--c-cat'), baseline:cssVar('--c-baseline'), rel:cssVar('--c-reltext'),
    pborder:cssVar('--c-pointborder'), vlabel:cssVar('--c-vlabel'), accent:cssVar('--accent')
  };
  const showVals = document.getElementById('showValues').checked;
  // full：该属性全部有值的点（不受区间限制）；raw：落在区间内的点
  const full = events
    .filter(e=>typeof e.tMs==='number' && e.propty[metric]!==undefined)
    .map(e=>({v:e.propty[metric], name:e.name, time:e.time, tMs:e.tMs, propty:e.propty}))
    .sort((a,b)=>a.tMs-b.tMs);
  const raw = full.filter(p=>p.tMs>=rangeStartMs && p.tMs<=rangeEndMs);

  const numeric = raw.length>0 && raw.every(p=>typeof p.v==='number');

  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.parentElement.clientWidth - 32;
  const cssH = 420;
  canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';
  canvas.width = cssW*dpr; canvas.height = cssH*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  // 类别模式需要更宽的左边距放类别名
  let categories = [];
  if(!numeric){
    const seen = new Set();
    raw.forEach(p=>{ const s=String(p.v); if(!seen.has(s)){seen.add(s); categories.push(s);} });
  }
  const padL = numeric ? 48 : Math.min(200, 60 + Math.max(0,...categories.map(c=>c.length))*7);
  const padR=24, padT=16, padB=78;
  const plotW = cssW-padL-padR;
  const plotH = cssH-padT-padB;

  // Y 轴映射
  let yOf, yMax, yMin=0;
  if(numeric){
    const dataMax = Math.max(...raw.map(p=>p.v), 0);
    yMax = metric==='fps' ? 60 : niceMax(dataMax);
    yMin = Math.min(0, ...raw.map(p=>p.v));
    yOf = v => padT + plotH*(1 - (v-yMin)/(yMax-yMin || 1));
  } else {
    const n = Math.max(1, categories.length-1);
    yOf = idx => padT + plotH*(1 - idx/n);
  }

  ctx.font='11px sans-serif';

  // Y 轴网格 / 刻度
  ctx.textBaseline='middle';
  if(numeric){
    const div=6;
    for(let i=0;i<=div;i++){
      const val = yMin + (yMax-yMin)*i/div;
      const y = yOf(val);
      ctx.strokeStyle=C.grid; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(cssW-padR,y); ctx.stroke();
      ctx.fillStyle=C.axis; ctx.textAlign='right'; ctx.fillText(fmtNum(val), padL-8, y);
    }
  } else {
    categories.forEach((c,idx)=>{
      const y = yOf(idx);
      ctx.strokeStyle=C.grid; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(cssW-padR,y); ctx.stroke();
      ctx.fillStyle=C.cat; ctx.textAlign='right';
      let lbl=c; if(lbl.length>26) lbl=lbl.slice(0,25)+'…';
      ctx.fillText(lbl, padL-8, y);
    });
  }

  // Y 轴标题
  ctx.save(); ctx.translate(13, padT+plotH/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle=C.axis; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(metric, 0, 0); ctx.restore();

  if(raw.length===0){
    ctx.fillStyle=C.axis; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('（当前筛选下没有含 “'+metric+'” 的事件）', cssW/2, padT+plotH/2);
    hitboxes=[]; return {count:0, numeric};
  }

  // 横轴用选定区间为边界，拖动滑块时视窗连续平移/缩放，边缘事件平滑移入移出
  // （默认区间正好等于该属性数据的首末点，所以首点仍贴左、末点仍贴右）
  let tMin = rangeStartMs, tMax = rangeEndMs;
  if(!(tMax>tMin)){ tMin = raw[0].tMs; tMax = raw[raw.length-1].tMs; }
  const span = tMax-tMin;
  const xOf = t => span===0 ? padL+plotW/2 : padL + plotW*((t-tMin)/span);

  // X 时间轴
  const baseY = padT+plotH;
  ctx.strokeStyle=C.baseline; ctx.beginPath(); ctx.moveTo(padL,baseY); ctx.lineTo(cssW-padR,baseY); ctx.stroke();
  const ticks = span===0 ? 0 : 6;
  ctx.textBaseline='top'; ctx.textAlign='center'; ctx.font='11px sans-serif';
  const ref = tFirstEvent || tMin;   // 相对时间参照点：第一个事件
  for(let i=0;i<=ticks;i++){
    const t = span===0 ? tMin : tMin + span*(i/ticks);
    const x = xOf(t);
    ctx.strokeStyle=C.vgrid; ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,baseY); ctx.stroke();
    ctx.strokeStyle=C.baseline; ctx.beginPath(); ctx.moveTo(x,baseY); ctx.lineTo(x,baseY+4); ctx.stroke();
    ctx.fillStyle=C.axis; ctx.fillText(fmtClock(t), x, baseY+7);              // 第1行：绝对时间
    ctx.fillStyle=C.rel; ctx.fillText(fmtRel(t-ref), x, baseY+23);           // 第2行：相对时间
  }
  ctx.textAlign='left';
  ctx.fillStyle=C.axis; ctx.fillText('时间', 0, baseY+7);
  ctx.fillStyle=C.rel; ctx.fillText('相对', 0, baseY+23);

  const coord = p => ({
    x: xOf(p.tMs),
    y: numeric ? yOf(p.v) : yOf(categories.indexOf(String(p.v))),
    ...p
  });

  // 计算每个点坐标（仅区间内，用于画点/数值/命中）
  const pts = raw.map(coord);

  // 折线：额外纳入区间外紧邻的左右各一个点，使靠近边缘的连线延伸到边框
  let linePts = raw;
  if(full.length > raw.length && raw.length > 0){
    const lo = full.indexOf(raw[0]);
    const hi = full.indexOf(raw[raw.length-1]);
    const startI = Math.max(0, lo-1);
    const endI = Math.min(full.length-1, hi+1);
    linePts = full.slice(startI, endI+1);
  }
  const lineCoords = linePts.map(coord);

  // 折线（裁剪到绘图区，越界的邻居连线在边框处被裁掉）
  ctx.save();
  ctx.beginPath(); ctx.rect(padL, padT, plotW, plotH); ctx.clip();
  ctx.beginPath();
  lineCoords.forEach((p,i)=>{ i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); });
  ctx.strokeStyle=C.accent; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();

  // 数据点
  hitboxes=[];
  pts.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,4.5,0,Math.PI*2);
    ctx.fillStyle = (numeric && metric==='fps') ? fpsColor(p.v) : C.accent;
    ctx.fill(); ctx.strokeStyle=C.pborder; ctx.lineWidth=1.5; ctx.stroke();
    if(numeric && showVals){
      ctx.fillStyle=C.vlabel; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.fillText(fmtNum(p.v), p.x, p.y-9);
    }
    hitboxes.push(p);
  });
  return {count:pts.length, numeric};
}

// tooltip
const tip = document.getElementById('tooltip');
canvas.addEventListener('mousemove', e=>{
  const r = canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  let hit=null, best=1e9;
  for(const h of hitboxes){ const d=(h.x-mx)**2+(h.y-my)**2; if(d<best&&d<225){best=d;hit=h;} }
  if(hit){
    const rel = fmtRel(hit.tMs-(tFirstEvent||hit.tMs));
    const esc = s => String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const rows = Object.entries(hit.propty||{}).map(([k,val])=>{
      const hot = (k===curMetric) ? ' style="color:#8ab4ff"' : '';
      return `<div class="tp-row"${hot}><span class="tp-k">${esc(k)}</span><span class="tp-v">${esc(val)}</span></div>`;
    }).join('');
    tip.innerHTML =
      `<div class="tp-title">${esc(hit.name)}</div>`+
      `<div class="tp-sub">${hit.time}　相对 ${rel}</div>`+
      `<div class="tp-props">${rows}</div>`;
    tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY+12)+'px'; tip.style.opacity=1;
  } else tip.style.opacity=0;
});
canvas.addEventListener('mouseleave',()=>tip.style.opacity=0);

// ---- 状态 ----
let allEvents = null;
let curDate='';
let curMetric='fps';
const checkedNames = new Set();
let tMinAll=0, tMaxAll=0;          // 全量事件的时间范围
let rangeStartMs=0, rangeEndMs=0;  // 当前时间区间筛选
let tFirstEvent=0;                 // 第一个事件时间，用作相对时间参照点

// 收集所有属性键 + 是否数值
function collectMetrics(events){
  const m = new Map(); // key -> {total, numeric}
  events.forEach(e=>{
    Object.entries(e.propty).forEach(([k,v])=>{
      if(!m.has(k)) m.set(k,{total:0,numeric:0});
      const s=m.get(k); s.total++; if(typeof v==='number') s.numeric++;
    });
  });
  return m;
}

// ---- 同轴双游标滑块（无外部依赖）----
let fracA=0, fracB=1;              // 两个游标各自的位置比例 0..1
function fracToMs(f){ return Math.round(tMinAll + (tMaxAll-tMinAll)*f); }

// 滑块范围跟随“当前属性实际有值的点”，保证滑块 0% = 图表最左点
function setupRange(events){
  const times = events
    .filter(e=>typeof e.tMs==='number' && e.propty[curMetric]!==undefined)
    .map(e=>e.tMs);
  const ctl = document.getElementById('rangeCtl');
  if(times.length===0){ ctl.style.display='none'; rangeStartMs=0; rangeEndMs=0; return; }
  tMinAll = Math.min(...times);
  tMaxAll = Math.max(...times);
  fracA=0; fracB=1;
  rangeStartMs = tMinAll; rangeEndMs = tMaxAll;
  ctl.style.display = (tMaxAll>tMinAll) ? 'flex' : 'none';
  positionThumbs();
  syncRangeLabels();
}

// 根据两个游标比例算出区间并更新视觉位置
function positionThumbs(){
  const lo=Math.min(fracA,fracB), hi=Math.max(fracA,fracB);
  rangeStartMs = fracToMs(lo);
  rangeEndMs   = fracToMs(hi);
  document.getElementById('dsThumbA').style.left = (fracA*100)+'%';
  document.getElementById('dsThumbB').style.left = (fracB*100)+'%';
  const fill=document.getElementById('dsFill');
  fill.style.left  = (lo*100)+'%';
  fill.style.width = ((hi-lo)*100)+'%';
}

function syncRangeLabels(){
  document.getElementById('rangeStartVal').textContent = fmtClockMs(rangeStartMs);
  document.getElementById('rangeEndVal').textContent = fmtClockMs(rangeEndMs);
  const total = tMaxAll - tMinAll;
  const sel = rangeEndMs - rangeStartMs;
  document.getElementById('rangeInfo').textContent =
    total>0 ? `区间 ${(sel/1000).toFixed(2)}s / 全程 ${(total/1000).toFixed(2)}s` : '';
}

// 拖拽
function bindDualSlider(){
  const slider=document.getElementById('dualSlider');
  let active=null;
  const fracFromEvent = e=>{
    const r=slider.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX);
    return Math.max(0, Math.min(1, (cx-r.left)/r.width));
  };
  const startDrag = which => e=>{
    active=which; e.preventDefault();
    document.getElementById('dsThumb'+which).focus();
  };
  const move = e=>{
    if(!active) return;
    const f=fracFromEvent(e);
    if(active==='A') fracA=f; else fracB=f;
    positionThumbs(); syncRangeLabels(); redraw();
  };
  const end = ()=>{ active=null; };

  document.getElementById('dsThumbA').addEventListener('mousedown', startDrag('A'));
  document.getElementById('dsThumbB').addEventListener('mousedown', startDrag('B'));
  document.getElementById('dsThumbA').addEventListener('touchstart', startDrag('A'), {passive:false});
  document.getElementById('dsThumbB').addEventListener('touchstart', startDrag('B'), {passive:false});
  window.addEventListener('mousemove', move);
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('mouseup', end);
  window.addEventListener('touchend', end);

  // 点击轨道：移动更近的游标
  slider.addEventListener('mousedown', e=>{
    if(e.target.classList.contains('ds-thumb')) return;
    const f=fracFromEvent(e);
    if(Math.abs(f-fracA)<=Math.abs(f-fracB)){ fracA=f; active='A'; }
    else { fracB=f; active='B'; }
    positionThumbs(); syncRangeLabels(); redraw();
  });

  // 键盘：左右微调（±1%），Shift 加速（±10%）
  const key = which => e=>{
    let f = which==='A'?fracA:fracB;
    const step=(e.shiftKey?0.1:0.01);
    if(e.key==='ArrowLeft'||e.key==='ArrowDown') f-=step;
    else if(e.key==='ArrowRight'||e.key==='ArrowUp') f+=step;
    else if(e.key==='Home') f=0;
    else if(e.key==='End') f=1;
    else return;
    e.preventDefault();
    f=Math.max(0,Math.min(1,f));
    if(which==='A') fracA=f; else fracB=f;
    positionThumbs(); syncRangeLabels(); redraw();
  };
  document.getElementById('dsThumbA').addEventListener('keydown', key('A'));
  document.getElementById('dsThumbB').addEventListener('keydown', key('B'));
}

function buildMetricSelect(events){
  const metrics = collectMetrics(events);
  const sel = document.getElementById('metric');
  sel.innerHTML='';
  // 排序：数值型优先，其次按出现次数
  const entries = [...metrics.entries()].sort((a,b)=>{
    const an=a[1].numeric>0, bn=b[1].numeric>0;
    if(an!==bn) return an?-1:1;
    return b[1].total-a[1].total;
  });
  entries.forEach(([k,s])=>{
    const opt=document.createElement('option');
    opt.value=k;
    const type = s.numeric===s.total ? '数值' : (s.numeric>0?'混合':'文本');
    opt.textContent = `${k}  (${type} · ${s.total})`;
    sel.appendChild(opt);
  });
  // 默认选 fps，否则第一个
  curMetric = metrics.has('fps') ? 'fps' : (entries[0] ? entries[0][0] : 'fps');
  sel.value = curMetric;
}

function buildFilter(events, metric){
  const stat = new Map(); // name -> {total, withMetric}
  events.forEach(e=>{
    if(!stat.has(e.name)) stat.set(e.name,{total:0,withMetric:0});
    const s=stat.get(e.name); s.total++;
    if(e.propty[metric]!==undefined) s.withMetric++;
  });
  const list = document.getElementById('filterList');
  list.innerHTML='';
  for(const [name,s] of stat){
    const label=document.createElement('label'); label.className='filter-item';
    const cb=document.createElement('input'); cb.type='checkbox';
    cb.checked = checkedNames.has(name); cb.value=name;
    cb.addEventListener('change', ()=>{
      if(cb.checked) checkedNames.add(name); else checkedNames.delete(name);
      redraw();
    });
    const txt=document.createElement('span'); txt.textContent=name;
    const cnt=document.createElement('span');
    if(s.withMetric>0){ cnt.className='cnt'; cnt.textContent=`×${s.withMetric}`; }
    else { cnt.className='nofps'; cnt.textContent='无'+metric; }
    label.append(cb,txt,cnt);
    list.appendChild(label);
  }
  document.getElementById('filterPanel').style.display='block';
}

function updateLegend(numeric){
  const el=document.getElementById('legend');
  if(numeric && curMetric==='fps'){
    el.innerHTML =
      '<span><i style="background:#e5484d"></i>低 (&lt;30)</span>'+
      '<span><i style="background:#e8a33d"></i>中 (30–50)</span>'+
      '<span><i style="background:#2fa36b"></i>高 (&gt;50)</span>';
  } else if(numeric){
    el.innerHTML = '<span><i style="background:#3b6cf6"></i>'+curMetric+' 数值</span>';
  } else {
    el.innerHTML = '<span><i style="background:#3b6cf6"></i>'+curMetric+' 类别轨迹（纵轴为出现过的取值）</span>';
  }
}

function redraw(){
  if(!allEvents) return;
  const filtered = allEvents.filter(e=>checkedNames.has(e.name));
  // 事件名的“无metric”标注依赖当前 metric，切换时重建筛选文字
  buildFilter(allEvents, curMetric);
  const res = drawChart(filtered, curMetric);
  updateLegend(res.numeric);
  document.getElementById('meta').textContent =
    `${curDate||'无日期'} · 共 ${allEvents.length} 事件 · 已选 ${checkedNames.size} 类 · 绘制 ${res.count} 点`;
  document.getElementById('metricInfo').textContent =
    res.numeric ? '数值波形，纵轴自动缩放' : '文本属性，纵轴为类别';
}

// ---- 交互 ----
const statusEl=document.getElementById('status');

function run(){
  const raw = document.getElementById('input').value;
  try{
    const data = parse(raw);
    curDate = data.date;
    allEvents = data.events;
    // 相对时间参照点 = 第一个事件（按时间最早），与所选属性无关
    const allT = allEvents.map(e=>e.tMs).filter(t=>typeof t==='number');
    tFirstEvent = allT.length ? Math.min(...allT) : 0;

    const clean = {date:data.date, events:data.events.map(e=>({time:e.time,name:e.name,propty:e.propty}))};
    document.getElementById('json').textContent = JSON.stringify(clean,null,2);
    document.getElementById('jsonPanel').style.display='block';
    document.getElementById('chartPanel').style.display='block';

    // 全选事件名
    checkedNames.clear();
    allEvents.forEach(e=>checkedNames.add(e.name));

    buildMetricSelect(allEvents);   // 先确定 curMetric
    setupRange(allEvents);          // 滑块范围依赖 curMetric
    redraw();
    statusEl.textContent='✓ 转换成功'; statusEl.className='status ok';
  }catch(err){
    statusEl.textContent='✗ '+err.message; statusEl.className='status err';
    document.getElementById('meta').textContent='';
    ['jsonPanel','chartPanel','filterPanel'].forEach(id=>document.getElementById(id).style.display='none');
    allEvents=null;
  }
}

document.getElementById('metric').addEventListener('change', e=>{
  curMetric=e.target.value;
  setupRange(allEvents);   // 新属性可能有不同的时间跨度，重置滑块范围
  redraw();
});
document.getElementById('showValues').addEventListener('change', redraw);
bindDualSlider();
document.getElementById('rangeReset').onclick = ()=>{
  fracA=0; fracB=1;
  positionThumbs(); syncRangeLabels(); redraw();
};
document.getElementById('run').onclick = run;
document.getElementById('demo').onclick = ()=>{ document.getElementById('input').value=DEMO; run(); };
document.getElementById('clear').onclick = ()=>{
  document.getElementById('input').value='';
  statusEl.textContent=''; document.getElementById('meta').textContent='';
  ['jsonPanel','chartPanel','filterPanel'].forEach(id=>document.getElementById(id).style.display='none');
  allEvents=null;
};
document.getElementById('checkAll').onclick = ()=>{ allEvents&&allEvents.forEach(e=>checkedNames.add(e.name)); redraw(); };
document.getElementById('checkNone').onclick = ()=>{ checkedNames.clear(); redraw(); };
document.getElementById('copyBtn').onclick = e=>{
  e.preventDefault();
  navigator.clipboard.writeText(document.getElementById('json').textContent)
    .then(()=>{ e.target.textContent='已复制'; setTimeout(()=>e.target.textContent='复制',1200); });
};
window.addEventListener('resize', redraw);

// ---- 日/夜模式 ----
function applyTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  const btn = document.getElementById('themeBtn');
  btn.textContent = mode==='dark' ? '☀️ 日间' : '🌙 夜间';
  if(allEvents) redraw();   // 重画 canvas 以套用新配色
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('theme'); }catch(e){}
  if(saved!=='dark' && saved!=='light'){
    saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(saved);
}
document.getElementById('themeBtn').onclick = ()=>{
  const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  try{ localStorage.setItem('theme', next); }catch(e){}
  applyTheme(next);
};
initTheme();
</script>
