<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数数用户行为序列 · FPS 波形图</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --border:#e4e7ec; --text:#1f2430;
    --muted:#6b7280; --accent:#3b6cf6; --danger:#e5484d; --ok:#2fa36b;
    --grid:#eceef1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    padding:24px;
  }
  h1{font-size:18px;margin:0 0 4px;}
  .sub{color:var(--muted);margin:0 0 18px;font-size:13px;}
  .wrap{max-width:1100px;margin:0 auto;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
  textarea{
    width:100%;min-height:180px;resize:vertical;border:1px solid var(--border);
    border-radius:8px;padding:12px;font:12px/1.55 "Consolas","Menlo",monospace;
    color:var(--text);background:#fbfcfd;outline:none;
  }
  textarea:focus{border-color:var(--accent);}
  .row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;}
  button{
    border:none;border-radius:8px;padding:9px 18px;font-size:14px;cursor:pointer;
    background:var(--accent);color:#fff;font-weight:500;
  }
  button:hover{filter:brightness(1.05);}
  button.ghost{background:#eef1f6;color:var(--text);}
  button.mini{padding:5px 12px;font-size:12px;}
  .status{font-size:13px;}
  .status.err{color:var(--danger);}
  .status.ok{color:var(--ok);}
  .meta{color:var(--muted);font-size:12px;margin-left:auto;}
  canvas{width:100%;display:block;}
  details{margin-top:4px;}
  summary{cursor:pointer;color:var(--muted);font-size:13px;user-select:none;}
  pre{
    background:#0f1420;color:#d7e0ef;border-radius:8px;padding:14px;overflow:auto;
    font:12px/1.5 "Consolas","Menlo",monospace;max-height:360px;margin:10px 0 0;
  }
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
  #tooltip{
    position:fixed;pointer-events:none;background:#0f1420;color:#fff;padding:6px 9px;
    border-radius:6px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .08s;
    z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .filter-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .filter-title{font-weight:600;font-size:14px;}
  .filter-list{display:flex;flex-wrap:wrap;gap:8px 18px;}
  .filter-item{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none;}
  .filter-item input{width:15px;height:15px;cursor:pointer;accent-color:var(--accent);}
  .filter-item .cnt{color:var(--muted);font-size:11px;}
  .filter-item .nofps{color:#c0392b;font-size:11px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>数数用户行为序列 · FPS 波形图</h1>
  <p class="sub">把「用户行为序列」原始文本粘贴进来，点击生成。横轴为时间轴，纵轴为 FPS（0–60）。下方可勾选/取消事件名称进行筛选。</p>

  <div class="panel">
    <textarea id="input" placeholder="在这里粘贴数数导出的原始文本，例如：&#10;2026-09-03&#10;12:17:47.882&#10;ta_app_start&#10;事件名称&#10;ta_app_start&#10;12:17:51.023&#10;总服登录上报token&#10;token&#10;MwTe...&#10;account&#10;LDL3509546285738&#10;事件名称&#10;SDKLoginToken&#10;fps&#10;60"></textarea>
    <div class="row">
      <button id="run">生成波形图</button>
      <button id="demo" class="ghost">填入示例</button>
      <button id="clear" class="ghost">清空</button>
      <span id="status" class="status"></span>
      <span id="meta" class="meta"></span>
    </div>
  </div>

  <div class="panel" id="filterPanel" style="display:none;">
    <div class="filter-head">
      <span class="filter-title">事件筛选</span>
      <button id="checkAll" class="ghost mini">全选</button>
      <button id="checkNone" class="ghost mini">全不选</button>
    </div>
    <div class="filter-list" id="filterList"></div>
  </div>

  <div class="panel" id="chartPanel" style="display:none;">
    <div class="legend">
      <span><i style="background:#e5484d"></i>低 (&lt;30)</span>
      <span><i style="background:#e8a33d"></i>中 (30–50)</span>
      <span><i style="background:#2fa36b"></i>高 (&gt;50)</span>
    </div>
    <canvas id="chart"></canvas>
  </div>

  <div class="panel" id="jsonPanel" style="display:none;">
    <details open>
      <summary>转换结果 JSON <span id="copyBtn" style="color:var(--accent);margin-left:8px;">复制</span></summary>
      <pre id="json"></pre>
    </details>
  </div>
</div>
<div id="tooltip"></div>

<script>
const DEMO = `2026-09-03
12:17:47.882
ta_app_start
事件名称
ta_app_start
12:17:51.023
总服登录上报token
token
MwTeEnzzNiV8zNTA5NTQ2MjhfMTc4ODQwOTA2OV9zZGsxMTM1MDQxNzAO0O0O
account
LDL3509546285738
事件名称
SDKLoginToken
fps
60
12:17:53.636
LoginSuccess
事件名称
LoginSuccess
fps
4
12:17:53.670
登陆步骤
state
ProcedureInitPackage
事件名称
loading_procedure
fps
4
12:17:55.474
登陆步骤
state
ProcedureLoadHotfix
事件名称
loading_procedure
fps
24
12:18:02.489
user_login_start
事件名称
user_login_start
fps
51
12:18:02.590
创角日志
事件名称
create_role_success
12:18:02.592
角色登陆日志
事件名称
role_login
12:18:11.981
引导
guid_id
1
事件名称
guide
fps
51`;

const timeRe = /^\d{1,2}:\d{2}:\d{2}\.\d{1,3}$/;
const dateRe = /^\d{4}-\d{2}-\d{2}$/;

function timeToMs(t){
  const m = t.match(/^(\d{1,2}):(\d{2}):(\d{2})\.(\d{1,3})$/);
  if(!m) return null;
  return ((+m[1])*3600 + (+m[2])*60 + (+m[3]))*1000 + Number(m[4].padEnd(3,'0'));
}

// 把原始文本解析成 {date, events:[{time,tMs,name,propty}]}
function parse(raw){
  const lines = raw.split(/\r?\n/).map(s=>s.trim()).filter(s=>s.length>0);
  if(lines.length===0) throw new Error("没有输入数据");

  let date = "";
  if(dateRe.test(lines[0])) date = lines[0];
  else { const d = lines.find(l=>dateRe.test(l)); if(d) date = d; }

  const content = lines.filter(l=>!dateRe.test(l));
  const events = [];
  let p = 0;

  while(p < content.length){
    if(!timeRe.test(content[p]))
      throw new Error(`解析失败：第 ${p+1} 行期望时间戳，却读到 “${content[p]}”`);
    const time = content[p++];

    if(p >= content.length)
      throw new Error(`解析失败：“${time}” 之后缺少事件标题`);
    const title = content[p++];

    const kvs = [];
    while(p < content.length && !timeRe.test(content[p])) kvs.push(content[p++]);
    if(kvs.length % 2 !== 0)
      throw new Error(`解析失败：事件 “${title}” (${time}) 的属性字段数为奇数，key/value 不成对`);

    const propty = {};
    for(let k=0;k<kvs.length;k+=2){
      const key = kvs[k];
      let val = kvs[k+1];
      if(/^-?\d+(\.\d+)?$/.test(val)) val = Number(val);
      propty[key] = val;
    }
    const name = propty["事件名称"] !== undefined ? String(propty["事件名称"]) : title;
    events.push({time, tMs:timeToMs(time), name, propty});
  }
  if(events.length===0) throw new Error("解析失败：未识别到任何事件");
  return {date, events};
}

// ---- 波形图（时间轴）----
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
let hitboxes = [];

function fpsColor(v){ return v<30?'#e5484d': v<=50?'#e8a33d':'#2fa36b'; }

function fmtClock(ms){
  const s = Math.floor(ms/1000);
  const hh = String(Math.floor(s/3600)%24).padStart(2,'0');
  const mm = String(Math.floor(s/60)%60).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  return `${hh}:${mm}:${ss}`;
}

// events: 已按筛选过滤后的事件数组
function drawChart(events){
  const pts = events
    .map(e=>({fps:e.propty.fps, name:e.name, time:e.time, tMs:e.tMs}))
    .filter(p=>typeof p.fps==='number' && typeof p.tMs==='number')
    .sort((a,b)=>a.tMs-b.tMs);

  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.parentElement.clientWidth - 32;
  const cssH = 420;
  canvas.style.width = cssW+'px';
  canvas.style.height = cssH+'px';
  canvas.width = cssW*dpr;
  canvas.height = cssH*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  const padL=44, padR=24, padT=16, padB=56;
  const plotW = cssW-padL-padR;
  const plotH = cssH-padT-padB;
  const maxY = 60;
  const yOf = v => padT + plotH*(1 - v/maxY);

  const tMin = pts.length ? pts[0].tMs : 0;
  const tMax = pts.length ? pts[pts.length-1].tMs : 1;
  const span = tMax - tMin;
  const xOf = t => (span===0) ? padL+plotW/2 : padL + plotW*((t-tMin)/span);

  // Y 轴网格
  ctx.font='11px sans-serif'; ctx.textBaseline='middle';
  for(let v=0; v<=60; v+=10){
    const y=yOf(v);
    ctx.strokeStyle='#eceef1'; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(cssW-padR,y); ctx.stroke();
    ctx.fillStyle='#9aa1ac'; ctx.textAlign='right'; ctx.fillText(v, padL-8, y);
  }
  // Y 轴标题
  ctx.save(); ctx.translate(12, padT+plotH/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle='#9aa1ac'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('FPS', 0, 0); ctx.restore();

  if(pts.length===0){
    ctx.fillStyle='#9aa1ac'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('（当前筛选下没有含 fps 的事件）', cssW/2, padT+plotH/2);
    hitboxes=[]; return pts;
  }

  // X 时间轴刻度（均匀 6 段）
  const baseY = padT+plotH;
  ctx.strokeStyle='#d7dbe0'; ctx.beginPath(); ctx.moveTo(padL,baseY); ctx.lineTo(cssW-padR,baseY); ctx.stroke();
  const ticks = span===0 ? 1 : 6;
  ctx.textBaseline='top'; ctx.textAlign='center';
  for(let i=0;i<=ticks;i++){
    const t = span===0 ? tMin : tMin + span*(i/ticks);
    const x = xOf(t);
    ctx.strokeStyle='#f0f2f5'; ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,baseY); ctx.stroke();
    ctx.strokeStyle='#d7dbe0'; ctx.beginPath(); ctx.moveTo(x,baseY); ctx.lineTo(x,baseY+4); ctx.stroke();
    ctx.fillStyle='#9aa1ac'; ctx.font='11px sans-serif';
    ctx.fillText(fmtClock(t), x, baseY+7);
    if(span===0) break;
  }
  // X 轴标题
  ctx.fillStyle='#9aa1ac'; ctx.textAlign='right';
  ctx.fillText('时间', cssW-padR, baseY+26);

  // 折线
  ctx.beginPath();
  pts.forEach((p,i)=>{ const x=xOf(p.tMs),y=yOf(p.fps); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.strokeStyle='#3b6cf6'; ctx.lineWidth=2; ctx.stroke();

  // 数据点
  hitboxes=[];
  pts.forEach(p=>{
    const x=xOf(p.tMs), y=yOf(p.fps);
    ctx.beginPath(); ctx.arc(x,y,4.5,0,Math.PI*2);
    ctx.fillStyle=fpsColor(p.fps); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#4b5563'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText(p.fps, x, y-9);
    hitboxes.push({x,y,...p});
  });
  return pts;
}

// tooltip
const tip = document.getElementById('tooltip');
canvas.addEventListener('mousemove', e=>{
  const r = canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  let hit=null, best=1e9;
  for(const h of hitboxes){ const d=(h.x-mx)**2+(h.y-my)**2; if(d<best&&d<225){best=d;hit=h;} }
  if(hit){
    tip.innerHTML = `<b>${hit.name}</b><br>时间 ${hit.time}<br>FPS ${hit.fps}`;
    tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY+12)+'px'; tip.style.opacity=1;
  } else tip.style.opacity=0;
});
canvas.addEventListener('mouseleave',()=>tip.style.opacity=0);

// ---- 筛选 ----
let allEvents = null;              // 解析出的全部事件
const checkedNames = new Set();    // 当前勾选的事件名

function buildFilter(events){
  // 统计每个事件名的总数 / 含 fps 数
  const stat = new Map(); // name -> {total, withFps}
  events.forEach(e=>{
    if(!stat.has(e.name)) stat.set(e.name, {total:0, withFps:0});
    const s = stat.get(e.name);
    s.total++;
    if(typeof e.propty.fps==='number') s.withFps++;
  });

  checkedNames.clear();
  const list = document.getElementById('filterList');
  list.innerHTML='';
  for(const [name,s] of stat){
    checkedNames.add(name);
    const label = document.createElement('label');
    label.className='filter-item';
    const cb = document.createElement('input');
    cb.type='checkbox'; cb.checked=true; cb.value=name;
    cb.addEventListener('change', ()=>{
      if(cb.checked) checkedNames.add(name); else checkedNames.delete(name);
      redraw();
    });
    const txt = document.createElement('span');
    txt.textContent = name;
    const cnt = document.createElement('span');
    if(s.withFps>0){ cnt.className='cnt'; cnt.textContent=`×${s.withFps}`; }
    else { cnt.className='nofps'; cnt.textContent='无fps'; }
    label.append(cb, txt, cnt);
    list.appendChild(label);
  }
  document.getElementById('filterPanel').style.display='block';
}

function redraw(){
  if(!allEvents) return;
  const filtered = allEvents.filter(e=>checkedNames.has(e.name));
  const pts = drawChart(filtered);
  document.getElementById('meta').textContent =
    `${curDate||'无日期'} · 共 ${allEvents.length} 事件 · 已选 ${checkedNames.size} 类 · 绘制 ${pts.length} 点`;
}

// ---- 交互 ----
const statusEl=document.getElementById('status');
let curDate='';

function run(){
  const raw = document.getElementById('input').value;
  const jsonPanel=document.getElementById('jsonPanel');
  const chartPanel=document.getElementById('chartPanel');
  try{
    const data = parse(raw);
    curDate = data.date;
    // JSON 输出去掉内部辅助字段 tMs
    const clean = {date:data.date, events:data.events.map(e=>({time:e.time,name:e.name,propty:e.propty}))};
    document.getElementById('json').textContent = JSON.stringify(clean,null,2);
    jsonPanel.style.display='block';
    chartPanel.style.display='block';

    allEvents = data.events;
    buildFilter(allEvents);
    redraw();
    statusEl.textContent = '✓ 转换成功'; statusEl.className='status ok';
  }catch(err){
    statusEl.textContent = '✗ '+err.message; statusEl.className='status err';
    document.getElementById('meta').textContent='';
    jsonPanel.style.display='none';
    chartPanel.style.display='none';
    document.getElementById('filterPanel').style.display='none';
    allEvents=null;
  }
}

document.getElementById('run').onclick = run;
document.getElementById('demo').onclick = ()=>{ document.getElementById('input').value=DEMO; run(); };
document.getElementById('clear').onclick = ()=>{
  document.getElementById('input').value='';
  statusEl.textContent=''; document.getElementById('meta').textContent='';
  document.getElementById('jsonPanel').style.display='none';
  document.getElementById('chartPanel').style.display='none';
  document.getElementById('filterPanel').style.display='none';
  allEvents=null;
};
document.getElementById('checkAll').onclick = ()=>{
  document.querySelectorAll('#filterList input').forEach(cb=>{ cb.checked=true; checkedNames.add(cb.value); });
  redraw();
};
document.getElementById('checkNone').onclick = ()=>{
  document.querySelectorAll('#filterList input').forEach(cb=>{ cb.checked=false; });
  checkedNames.clear();
  redraw();
};
document.getElementById('copyBtn').onclick = e=>{
  e.preventDefault();
  navigator.clipboard.writeText(document.getElementById('json').textContent)
    .then(()=>{ e.target.textContent='已复制'; setTimeout(()=>e.target.textContent='复制',1200); });
};
window.addEventListener('resize', redraw);
</script>
</body>
</html>
